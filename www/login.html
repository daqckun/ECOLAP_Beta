<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECOLAP | Iniciar Sesión</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --ecolap-esmeralda: #00A86B;
            --ecolap-hoja: #2ECC71;
            --ecolap-oscuro: #1B4D3E;
            --ecolap-blanco: #FFFFFF;
            --ecolap-neon: #00FF87;
            --login-bg-dark: #0b1d16;
            --transicion: all 0.2s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            color: var(--ecolap-blanco);
            background-color: var(--login-bg-dark);
            display: flex;
            flex-direction: column;
            -webkit-tap-highlight-color: transparent;
        }

        h1, h2, h3 { font-family: 'Poppins', sans-serif; }
        a { text-decoration: none; color: inherit; }
        button { font-family: inherit; cursor: pointer; border: none; background: none; }

        /* HEADER */
        .ecolap-compact-header {
            padding: 14px 20px;
            background-color: #081711;
            border-bottom: 1px solid rgba(0, 255, 135, 0.2);
        }

        .ecolap-compact-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .ecolap-logo-glow {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 1.2rem;
        }

        .ecolap-logo-icon {
            width: 36px;
            height: 36px;
            background: var(--ecolap-esmeralda);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ecolap-logo-text span { color: var(--ecolap-neon); }

        .ecolap-back-btn {
            color: var(--ecolap-neon);
            font-size: 0.85rem;
            padding: 6px 14px;
            border: 1px solid var(--ecolap-neon);
            border-radius: 20px;
        }

        /* SECCIÓN PRINCIPAL */
        .ecolap-login-section {
            flex: 1;
            padding: 20px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .ecolap-login-container {
            width: 100%;
            max-width: 450px;
            background-color: #122b20;
            border: 1px solid rgba(0, 255, 135, 0.2);
            border-radius: 20px;
            padding: 24px 20px;
        }

        /* PANEL SUPERIOR BIENVENIDA */
        .ecolap-login-visual {
            text-align: center;
            margin-bottom: 20px;
        }

        .ecolap-visual-badge {
            width: 60px;
            height: 60px;
            background: var(--ecolap-esmeralda);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
            font-size: 1.8rem;
        }

        .ecolap-visual-title {
            font-size: 1.4rem;
            margin-bottom: 6px;
        }
        .ecolap-visual-title span { color: var(--ecolap-neon); }

        .ecolap-visual-subtitle {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 16px;
        }

        /* ROLES */
        .ecolap-role-options {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 12px;
        }

        .ecolap-role-option {
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 255, 135, 0.2);
            border-radius: 10px;
            padding: 10px 4px;
            text-align: center;
            font-size: 0.75rem;
        }

        .ecolap-role-option.active {
            border-color: var(--ecolap-neon);
            background-color: rgba(0, 255, 135, 0.15);
            color: var(--ecolap-neon);
            font-weight: 700;
        }

        .ecolap-role-message {
            font-size: 0.8rem;
            color: var(--ecolap-neon);
            background-color: rgba(0, 255, 135, 0.1);
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        /* FORMULARIO */
        .ecolap-form-tabs {
            display: flex;
            background-color: rgba(0, 0, 0, 0.3);
            border-radius: 25px;
            padding: 3px;
            margin-bottom: 20px;
        }

        .ecolap-form-tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            font-size: 0.85rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.6);
            border-radius: 25px;
        }

        .ecolap-form-tab.active {
            background-color: var(--ecolap-neon);
            color: #0b1d16;
        }

        .ecolap-form-content { display: none; }
        .ecolap-form-content.active { display: block; }

        .ecolap-google-btn {
            width: 100%;
            padding: 12px;
            background-color: var(--ecolap-blanco);
            border-radius: 25px;
            font-weight: 600;
            font-size: 0.9rem;
            color: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .ecolap-neon-divider {
            text-align: center;
            margin: 16px 0;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.5);
        }

        .ecolap-input-group { margin-bottom: 12px; text-align: left; }
        .ecolap-input-group label {
            display: block;
            color: var(--ecolap-neon);
            font-size: 0.75rem;
            margin-bottom: 4px;
            font-weight: 600;
        }

        .ecolap-glow-input {
            width: 100%;
            padding: 12px;
            background-color: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(0, 255, 135, 0.3);
            border-radius: 10px;
            color: white;
            font-size: 0.9rem;
        }

        .ecolap-glow-input:focus {
            outline: none;
            border-color: var(--ecolap-neon);
        }

        .ecolap-shine-btn {
            width: 100%;
            padding: 14px;
            background: var(--ecolap-esmeralda);
            color: white;
            border-radius: 25px;
            font-weight: 700;
            font-size: 0.95rem;
            margin-top: 10px;
            margin-bottom: 12px;
        }

        .ecolap-form-footer {
            text-align: center;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.6);
        }
        .ecolap-form-footer a { color: var(--ecolap-neon); font-weight: 600; }

        /* FOOTER */
        .ecolap-compact-footer {
            text-align: center;
            padding: 16px;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.4);
            background-color: #081711;
        }
    </style>
</head>

<body>

    <header class="ecolap-compact-header">
        <div class="ecolap-compact-nav">
            <a href="index.html" class="ecolap-logo-glow">
                <div class="ecolap-logo-icon">🌿</div>
                <div class="ecolap-logo-text">ECO<span>LAP</span></div>
            </a>
            <a href="index.html" class="ecolap-back-btn">← Volver</a>
        </div>
    </header>

    <section class="ecolap-login-section">
        <div class="ecolap-login-container">

            <div class="ecolap-login-visual">
                <div class="ecolap-visual-badge">🌍</div>
                <h1 class="ecolap-visual-title">¡Hola, <span>Mariana</span>!</h1>
                <p class="ecolap-visual-subtitle">Súmate al cambio verde con ECOLAP.</p>

                <div class="ecolap-role-selector">
                    <div class="ecolap-role-options">
                        <div class="ecolap-role-option active" data-role="usuario">👤 Usuario</div>
                        <div class="ecolap-role-option" data-role="conductor">🚛 Conductor</div>
                        <div class="ecolap-role-option" data-role="admin">⚙️ Admin</div>
                    </div>
                    <p class="ecolap-role-message" id="roleMessage">💚 Mariana, tu impacto empieza aquí.</p>
                </div>
            </div>

            <div class="ecolap-login-form-card">
                <div class="ecolap-form-tabs">
                    <button class="ecolap-form-tab active" data-tab="login">Iniciar Sesión</button>
                    <button class="ecolap-form-tab" data-tab="register">Registrarse</button>
                </div>

                <form class="ecolap-form-content active" id="loginForm">
                    <button type="button" class="ecolap-google-btn" onclick="iniciarConGoogle()">
                        <span style="color: #4285F4; font-weight: bold;">G</span> Continuar con Google
                    </button>

                    <div class="ecolap-neon-divider">o ingresa tu correo</div>

                    <div class="ecolap-input-group">
                        <label for="loginEmail">Correo Electrónico</label>
                        <input type="email" id="loginEmail" class="ecolap-glow-input" placeholder="tu@correo.com" required>
                    </div>

                    <div class="ecolap-input-group">
                        <label for="loginPassword">Contraseña</label>
                        <input type="password" id="loginPassword" class="ecolap-glow-input" placeholder="••••••••" required>
                    </div>

                    <button type="submit" class="ecolap-shine-btn">Iniciar Sesión</button>

                    <p class="ecolap-form-footer">
                        ¿Sin cuenta? <a href="#" data-switch="register">Regístrate</a>
                    </p>
                </form>

                <form class="ecolap-form-content" id="registerForm">
                    <button type="button" class="ecolap-google-btn" onclick="iniciarConGoogle()">
                        <span style="color: #4285F4; font-weight: bold;">G</span> Registrarse con Google
                    </button>

                    <div class="ecolap-neon-divider">o crea tu cuenta</div>

                    <div class="ecolap-input-group">
                        <label for="registerName">Nombre Completo</label>
                        <input type="text" id="registerName" class="ecolap-glow-input" value="Mariana" required>
                    </div>

                    <div class="ecolap-input-group">
                        <label for="registerEmail">Correo Electrónico</label>
                        <input type="email" id="registerEmail" class="ecolap-glow-input" placeholder="tu@correo.com" required>
                    </div>

                    <div class="ecolap-input-group">
                        <label for="registerPassword">Contraseña</label>
                        <input type="password" id="registerPassword" class="ecolap-glow-input" placeholder="Mínimo 6 caracteres" required minlength="6">
                    </div>

                    <button type="submit" class="ecolap-shine-btn">Crear Cuenta</button>

                    <p class="ecolap-form-footer">
                        ¿Ya tienes cuenta? <a href="#" data-switch="login">Iniciar sesión</a>
                    </p>
                </form>
            </div>

        </div>
    </section>

    <footer class="ecolap-compact-footer">
        © 2026 ECOLAP. Juntos por un planeta más verde 🍃
    </footer>

    <script>
        // 🌐 Reemplaza por la URL de tu backend desplegado en la nube (ej: Render, Railway)
        const API_URL = 'https://tu-backend-ecolap.onrender.com/api'; 
        
        let selectedRole = 'usuario';

        const roleOptions = document.querySelectorAll('.ecolap-role-option');
        const roleMessage = document.getElementById('roleMessage');

        const roleMessages = {
            usuario: "💚 Mariana, tu impacto empieza aquí.",
            conductor: "🚛 Módulo de recolección y rutas optimizadas.",
            admin: "⚙️ Panel de administración ECOLAP."
        };

        roleOptions.forEach(option => {
            option.addEventListener('click', () => {
                roleOptions.forEach(opt => opt.classList.remove('active'));
                option.classList.add('active');
                selectedRole = option.dataset.role;
                roleMessage.textContent = roleMessages[selectedRole];
            });
        });

        const tabs = document.querySelectorAll('.ecolap-form-tab');
        const forms = document.querySelectorAll('.ecolap-form-content');
        const switchLinks = document.querySelectorAll('[data-switch]');

        function switchTab(targetTab) {
            tabs.forEach(tab => tab.classList.toggle('active', tab.dataset.tab === targetTab));
            forms.forEach(form => form.classList.toggle('active', form.id === `${targetTab}Form`));
        }

        tabs.forEach(tab => tab.addEventListener('click', () => switchTab(tab.dataset.tab)));
        switchLinks.forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                switchTab(link.dataset.switch);
            });
        });

        // Iniciar Sesión
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            try {
                const response = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password, rol: selectedRole })
                });

                const data = await response.json();
                if (response.ok) {
                    alert(`¡Bienvenida ${data.usuario.nombre}!`);
                    localStorage.setItem('usuarioEcolap', JSON.stringify(data.usuario));
                    window.location.href = 'index.html';
                } else {
                    alert(data.mensaje || 'Credenciales incorrectas');
                }
            } catch (error) {
                alert('No se pudo conectar con el servidor.');
            }
        });

        // Registro
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nombre = document.getElementById('registerName').value;
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;

            try {
                const response = await fetch(`${API_URL}/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nombre, email, password, rol: selectedRole })
                });

                const data = await response.json();
                if (response.ok) {
                    alert('¡Registro exitoso! Ya puedes iniciar sesión.');
                    switchTab('login');
                } else {
                    alert(data.mensaje || 'Error al registrar.');
                }
            } catch (error) {
                alert('No se pudo conectar con el servidor.');
            }
        });

        // Google
        async function iniciarConGoogle() {
            const correoGoogle = prompt("Ingresa tu correo de Google:");
            if (!correoGoogle) return;

            const nombreGoogle = "Mariana";

            try {
                const response = await fetch(`${API_URL}/google-login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        nombre: nombreGoogle,
                        email: correoGoogle,
                        google_id: 'google_123456789'
                    })
                });

                const data = await response.json();
                if (response.ok) {
                    alert(`¡Bienvenida ${data.usuario.nombre}!`);
                    localStorage.setItem('usuarioEcolap', JSON.stringify(data.usuario));
                    window.location.href = 'index.html';
                } else {
                    alert(data.mensaje || 'Error con Google');
                }
            } catch (error) {
                alert('No se pudo conectar con el servidor.');
            }
        }
    </script>
</body>
</html>
